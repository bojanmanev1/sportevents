<div class="events-grid-container">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search events</mat-label>
    <input
      matInput
      [(ngModel)]="searchText"
      (input)="applyFilters()"
      placeholder="Type event name..."
    />
  </mat-form-field>

  <mat-card class="events-table-card">
    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      class="mat-elevation-z4"
    >

      <!-- Event Name -->
      <ng-container matColumnDef="name">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Event
        </th>
        <td mat-cell *matCellDef="let e">
          {{ e.name }}
        </td>
      </ng-container>

      <!-- Sport -->
      <ng-container matColumnDef="sport">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Sport
        </th>
        <td mat-cell *matCellDef="let e">
          {{ e.sport }}
        </td>
      </ng-container>

      <!-- Discipline -->
      <ng-container matColumnDef="discipline">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Discipline
        </th>
        <td mat-cell *matCellDef="let e">
          {{ e.discipline }}
        </td>
      </ng-container>

      <!-- Location -->
      <ng-container matColumnDef="location">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Location
        </th>
        <td mat-cell *matCellDef="let e">
          {{ e.location }}
        </td>
      </ng-container>

      <!-- Registration -->
      <ng-container matColumnDef="registration">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Registration
        </th>
        <td mat-cell *matCellDef="let e">
          <span
            class="status"
            [class.open]="e.registration === 'Open'"
            [class.closed]="e.registration === 'Closed'"
            [class.notOpenYet]="e.registration === 'Not open yet'"
          >
            {{ e.registration }}
          </span>
        </td>
      </ng-container>

      <!-- Start Date -->
      <ng-container matColumnDef="startDate">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Start Date
        </th>
        <td mat-cell *matCellDef="let e">
          {{ e.startDate }}
        </td>
      </ng-container>

      <!-- Header & Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        (click)="openTournamentDialog(row)"
        class="clickable-row"
      ></tr>
    </table>
  </mat-card>
</div>
