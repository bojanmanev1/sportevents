<div class="sports-menu">

  <!-- MOBILE SHOW MORE -->
   @if(isMobile && sports.length > mobileLimit){
     <button
       class="show-more-btn"
       (click)="showAllMobile = !showAllMobile"
     >
       <mat-icon>
         {{ showAllMobile ? 'expand_less' : 'expand_more' }}
       </mat-icon>
       <span>
         {{ showAllMobile ? 'Show less' : 'Show more sports' }}
       </span>
     </button>
   }

  <div class="sports-toggle-group">
    @for (sport of visibleSports; track sport.name) {
      <button
        mat-flat-button
        (click)="selectSport(sport.name)"
        [ngClass]="{ active: isSelected(sport.name) }"
        class="sport-button"
      >
        <mat-icon>{{ sport.icon }}</mat-icon>
        <span>{{ sport.name }}</span>
      </button>
    }
  </div>

</div>
