<h2 mat-dialog-title class="dialog-title">
  {{'registerfor' | translate}} {{ data.tournament.name }}
</h2>

<div mat-dialog-content class="form-content">
  <mat-form-field appearance="outline">
    <mat-label>{{'name' | translate}}</mat-label>
    <input matInput [(ngModel)]="name" />
  </mat-form-field>


  <mat-form-field appearance="outline">
    <mat-label>{{'mobilephone' | translate}}</mat-label>
    <input matInput [(ngModel)]="phone" type="tel" />
  </mat-form-field>
</div>

<div mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button (click)="close()">{{'back' | translate}}</button>
  <button mat-raised-button color="primary" (click)="submit()">{{"send" | translate}}</button>
</div>
